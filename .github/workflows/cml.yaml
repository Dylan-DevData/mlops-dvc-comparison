name: dvc-pipeline

on:
  pull_request:
    branches: [ "main" ]

permissions: write-all

jobs:
  train_and_report_eval_performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies for CML
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Setup CML
        uses: iterative/setup-cml@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      # L'approche DataCamp : Installation de DVC via l'action officielle globale
      - name: Setup DVC
        uses: iterative/setup-dvc@v1
          
      # Installation des dépendances de calcul requises par vos scripts Python
      - name: Install Python ML libraries
        run: |
          pip install pandas scikit-learn matplotlib

      # Exécution du pipeline DVC
      - name: Run DVC pipeline
        run: dvc repro

      - name: Write CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 📊 Rapport de Performance Officiel" > metrics_compare.md
          
          # Synchronisation des branches et comparaison
          git fetch --prune --unshallow || git fetch --prune
          echo "### ⚔️ Différences de métriques vs main" >> metrics_compare.md
          dvc metrics diff main --md >> metrics_compare.md
          
          # Publication du commentaire
          cml comment create metrics_compare.md
